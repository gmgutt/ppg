name: Build

on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version-file: '.java-version'
          distribution: 'temurin'
          cache: maven

      # PIT threads = nproc. Each thread runs its own JVM (Quarkus boot per thread), so if
      # runners get large, cap it, e.g. -Dpitest.threads=$(( $(nproc) > 4 ? 4 : $(nproc) ))
      # Locally, pitest.threads defaults to 1 (see pom.xml).
      - name: Build with Maven
        run: ./mvnw -B verify -Dpitest.threads=$(nproc)
