name: Build

on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version-file: '.java-version'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: ./mvnw -B verify
